spring:
  application:
    name: product-mcp

  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    mcp:
      server:
        name: product-mcp-server
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        instructions: "Tools for managing the product catalog: list, search, fetch, create, update, and delete products."

server:
  port: 8080
