spring:
  application:
    name: product-mcp

  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 console is disabled by default (attack surface). Enable it only for local
  # debugging by running with the "dev" profile (see the profile block below).
  h2:
    console:
      enabled: false
      path: /h2-console

  # Phase 1: OAuth2 Resource Server. The server validates Bearer JWTs against the
  # IdP's public keys (JWKS). jwk-set-uri fetches lazily on first request, so this
  # server still starts before the IdP (sub-PR #3) exists — requests just fail to
  # validate until it does. Point JWT_JWK_SET_URI at Entra/Okta to switch IdPs.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

  ai:
    mcp:
      server:
        name: product-mcp-server
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        instructions: "Tools for managing the product catalog: list, search, fetch, create, update, and delete products."

server:
  port: 8080

---
# Local-only profile: `mvn spring-boot:run -Dspring-boot.run.profiles=dev`
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
