spring:
  application:
    name: order-mcp

  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    mcp:
      server:
        name: order-mcp-server
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        instructions: "Tools for managing customer orders: list, search, fetch, create, update status, and cancel orders."

server:
  port: 8081
