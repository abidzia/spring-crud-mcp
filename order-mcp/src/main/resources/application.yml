spring:
  application:
    name: order-mcp

  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # H2 console is disabled by default (attack surface). Enable it only for local
  # debugging by running with the "dev" profile (see the profile block below).
  h2:
    console:
      enabled: false
      path: /h2-console

  ai:
    mcp:
      server:
        name: order-mcp-server
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        instructions: "Tools for managing customer orders: list, search, fetch, create, update status, and cancel orders."

server:
  port: 8081

---
# Local-only profile: `mvn spring-boot:run -Dspring-boot.run.profiles=dev`
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
